# Source of truth for GitHub labels, milestones and issues.
# Consumed by .github/workflows/seed-roadmap.yml. Items are matched by name/title,
# so re-running only creates what is missing. Existing issues aren't modified.

labels:
  - { name: "area:core",     color: "1d76db", description: "Shared domain package (types, schemas, logic)" }
  - { name: "area:storage",  color: "5319e7", description: "Repository interface, SQLite, migrations" }
  - { name: "area:ui",       color: "0e8a16", description: "Shared React components" }
  - { name: "area:desktop",  color: "006b75", description: "Tauri desktop shell" }
  - { name: "area:infra",    color: "bfdadc", description: "Tooling, CI, releases" }
  - { name: "area:web",      color: "c5def5", description: "Web app" }
  - { name: "area:mobile",   color: "d4c5f9", description: "Mobile app" }
  - { name: "area:backend",  color: "f9d0c4", description: "Supabase schema, auth, sync rules" }
  - { name: "type:feature",  color: "a2eeef", description: "New functionality" }
  - { name: "type:chore",    color: "ededed", description: "Setup, refactor, maintenance" }
  - { name: "type:spike",    color: "fbca04", description: "Research / decision" }
  - { name: "priority:high", color: "b60205", description: "Needed for MVP" }
  - { name: "priority:low",  color: "c2e0c6", description: "Nice to have" }

milestones:
  - title: "Phase 0 — Foundations"
    description: "Monorepo, CI, core schemas, storage interface, empty desktop app builds."
  - title: "Phase 1 — Song library"
    description: "Song CRUD, search/filter, tags, status, CSV import."
  - title: "Phase 2 — Gigs & setlist builder"
    description: "Venues, gigs, multi-set editor with drag and drop."
  - title: "Phase 3 — Cloning & templates"
    description: "Clone setlists from any gig or template, lineage."
  - title: "Phase 4 — Sharing & collaboration"
    description: "View links, invites, anonymous identity, live sync, roles. No sign-up needed."
  - title: "Phase 5 — History & insights"
    description: "Performance snapshots, song history, stats."
  - title: "Phase 6 — Output & stage use"
    description: "Print/PDF, stage mode, backup/restore."
  - title: "Phase 7 — Release & distribution"
    description: "Signed installers, auto-update, release pipeline."
  - title: "Phase 8 — Web & mobile apps"
    description: "Full web app and mobile app on the shared core and sync."

issues:
  # ───────────────────────── Phase 0 ─────────────────────────
  - title: "Decide desktop shell: Tauri 2 vs Electron"
    milestone: "Phase 0 — Foundations"
    labels: ["type:spike", "area:desktop", "priority:high"]
    body: |
      Compare Tauri 2 and Electron for installer size, SQLite access, DnD support in the webview, and the path to mobile.
      **Done when:** decision recorded in `docs/adr/0001-desktop-shell.md`.

  - title: "Set up pnpm monorepo (packages/core, storage, ui; apps/desktop)"
    milestone: "Phase 0 — Foundations"
    labels: ["type:chore", "area:infra", "priority:high"]
    body: |
      - pnpm workspaces, shared tsconfig, ESLint, Prettier
      - Vitest configured per package
      **Done when:** `pnpm -r build` and `pnpm -r test` succeed locally.

  - title: "CI: lint, typecheck and test on pull requests"
    milestone: "Phase 0 — Foundations"
    labels: ["type:chore", "area:infra", "priority:high"]
    body: |
      GitHub Actions workflow on `pull_request` and `push` to `main`: install, lint, typecheck, test.
      **Done when:** PRs show a required green check.

  - title: "CI: build desktop app on Windows and macOS"
    milestone: "Phase 0 — Foundations"
    labels: ["type:chore", "area:infra", "area:desktop"]
    body: |
      Matrix build of `apps/desktop` (unsigned) and upload as workflow artifacts.
      **Done when:** a PR produces downloadable test builds.

  - title: "Core: Zod schemas and TS types for all entities"
    milestone: "Phase 0 — Foundations"
    labels: ["type:feature", "area:core", "priority:high"]
    body: |
      Band, BandMember, Invite, ShareLink, CatalogTrack, Song (with `catalogTrackId`, `spotifyId`, `isrc`, `artworkUrl`), Venue, Gig, Setlist, SetBlock, SetEntry, Performance, plus base fields (`id` UUIDv7, `createdAt`, `updatedAt`, `updatedBy`, `deletedAt`, `version`). See ROADMAP.md → Data model.
      **Done when:** schemas exported from `@setlist/core` with unit tests for valid and invalid samples.

  - title: "Core: fractional-index ordering helpers"
    milestone: "Phase 0 — Foundations"
    labels: ["type:feature", "area:core", "priority:high"]
    body: |
      `keyBetween(a, b)`, `move(items, from, to)` that return a single new position key. Used for set entries and set blocks.
      **Done when:** property tests confirm the order is stable after random moves.

  - title: "Storage: Repository interface"
    milestone: "Phase 0 — Foundations"
    labels: ["type:feature", "area:storage", "priority:high"]
    body: |
      Async interface per aggregate (songs, venues, gigs, setlists, performances) with transactions. No platform imports.
      Include an in-memory implementation for tests.

  - title: "Storage: SQLite implementation + migrations (Drizzle)"
    milestone: "Phase 0 — Foundations"
    labels: ["type:feature", "area:storage", "area:desktop", "priority:high"]
    body: |
      Tables, indexes, soft-delete filtering, migration runner on app start. The schema must follow the chosen sync engine's constraints (for example UUID text primary keys, no cross-band foreign keys), so sync can be added in Phase 4 without a migration of identity.
      **Done when:** the shared repository contract tests pass against SQLite.

  - title: "Decide sync stack: Supabase + PowerSync vs ElectricSQL"
    milestone: "Phase 0 — Foundations"
    labels: ["type:spike", "area:storage", "area:backend", "priority:high"]
    body: |
      Pick the engine that syncs local SQLite with Postgres. Compare Tauri support, browser storage for the web viewer, anonymous auth with Supabase, partial sync per band, conflict handling (last write wins per row, soft deletes as tombstones), free tier and self-hosting.
      **Done when:** decision recorded in `docs/adr/0002-sync-stack.md`, including the schema constraints the SQLite layer must follow.

  - title: "Desktop: app shell with navigation (Library, Gigs, Templates, Stats)"
    milestone: "Phase 0 — Foundations"
    labels: ["type:feature", "area:desktop", "area:ui"]
    body: |
      Sidebar layout, routing, light/dark theme, empty states.

  - title: "Backend: create the Supabase project and local development setup"
    milestone: "Phase 0 — Foundations"
    labels: ["type:chore", "area:backend", "area:infra", "priority:high"]
    body: |
      A dedicated Supabase project for Setlist Maker (separate from the existing catalog project). `supabase/` folder with config and migrations, `supabase start` for local development, and a CI job that applies migrations on merge to `main`. Secrets live in Supabase and GitHub secrets, never in the repo.
      **Done when:** a migration merged to `main` is applied to the project automatically.

  # ───────────────────────── Phase 1 ─────────────────────────
  - title: "Spotify: register the app and review the Developer Terms"
    milestone: "Phase 1 — Song library"
    labels: ["type:spike", "area:backend", "priority:high"]
    body: |
      Create the Spotify developer app and store its client ID and secret as Supabase secrets. Confirm which data may be stored long-term in the shared catalog, the attribution and branding rules, and rate limits.
      **Done when:** findings recorded in `docs/adr/0003-spotify.md`, including what the catalog may keep.

  - title: "Catalog: catalog_tracks table and search"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:backend", "priority:high"]
    body: |
      Postgres table: `spotify_id` and `isrc` (unique when present), title, artists, album, release year, duration, artwork URL, source (`seed` or `spotify`). Accent-insensitive trigram index on title and artists. Row-level security makes it readable by anyone and writable only by Edge Functions and the seed script.
      **Done when:** a search over the seeded catalog returns ranked results quickly.

  - title: "Seed the catalog from the existing Supabase project"
    milestone: "Phase 1 — Song library"
    labels: ["type:chore", "area:backend", "priority:high"]
    body: |
      Script in `supabase/seed/` that loads the CSV export of the existing project's song catalog (`id, title, artist, duration, ref_link`; 6,573 rows) into `catalog_tracks`, upserting in batches keyed on `spotify_id`. Re-running only adds or updates rows.
      The CSV isn't in the repo (`misc/songs.csv` is git-ignored), so the script takes its path as an argument, for example `pnpm seed:catalog misc/songs.csv`.

      | CSV column | `catalog_tracks` | Notes |
      |---|---|---|
      | `ref_link` | `spotify_id` | Track ID parsed from `https://open.spotify.com/track/<id>`. Every row has one and all are unique. Rows without a valid link are reported and skipped. |
      | `title` | `title` | As is. Some include version suffixes such as "- Remastered"; strip them only in the search key, not the stored title. |
      | `artist` | `artists` | One-element array. Don't split on commas or "&": names like "Blood, Sweat & Tears" are one act. The enrichment step fills in the real artist list. |
      | `duration` | `duration_sec` | **Decimal minutes**, not minutes.seconds (3.34 = 3:20, and 2,605 rows have decimals ≥ .60). `round(duration × 60)`. |
      | `id` | (not kept) | The Spotify ID is the identity. |
      | (constant) | `source` | `'seed'` |

      The CSV has no ISRC, album, release year or artwork; those come from "Enrich the seeded catalog from Spotify".
      **Done when:** 6,573 rows are loaded, a second run changes nothing, and spot checks match Spotify.

  - title: "Enrich the seeded catalog from Spotify"
    milestone: "Phase 1 — Song library"
    labels: ["type:chore", "area:backend"]
    body: |
      Look up each seeded track by its Spotify ID and fill in ISRC, album, release year, artwork and the full artist list, replacing the approximate CSV duration with Spotify's exact one. Runs in small batches within Spotify's rate limits, resumes where it stopped, and only touches rows not yet enriched. Check the current Development Mode endpoint limits as part of the Spotify spike.
      **Done when:** seeded rows show artwork in search results, and tracks Spotify no longer has are flagged rather than deleted.

  - title: "Edge Function: catalog-search with Spotify fallback"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:backend", "priority:high"]
    body: |
      `catalog-search?q=` callable with the anon key (no sign-up). Searches the catalog first; on a miss, calls Spotify search with a cached client-credentials token, upserts the results into the catalog and returns them. Rate limited per device, and returns catalog-only results when Spotify is unavailable.
      **Done when:** repeated searches are served from the catalog without calling Spotify.

  - title: "Song library: add songs from search"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:ui", "area:core", "priority:high"]
    body: |
      Search-as-you-type in the "Add song" dialog, with artwork, artists, year and duration in the results. Picking one pre-fills the song form and stores the catalog and Spotify IDs. Already-added songs are marked. "Add manually" stays available for originals and works offline. Spotify attribution and an "Open in Spotify" link wherever its data appears.

  - title: "Suggest key and BPM for new songs"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:backend", "priority:low"]
    body: |
      Spotify no longer provides key or tempo to new apps. Evaluate a source such as GetSongBPM, look it up by title + artist inside the Edge Function, and show it as a suggestion the band can accept or change.

  - title: "Song library: list view with sort and search"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:ui", "priority:high"]
    body: |
      Table with title, artist, key, BPM, duration, status, tags. Fast text search, sortable columns, and virtualized for large catalogues.

  - title: "Song library: create / edit / archive song"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:ui", "area:core", "priority:high"]
    body: |
      Form validated by the core schema. Archiving sets `status: retired` (soft). Deleting is a soft delete and is blocked if the song has performances.

  - title: "Song library: tags and status filters"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:ui"]
    body: |
      Filter by tags (multi-select), status, original vs cover, key, BPM range.

  - title: "Song library: CSV import with column mapping"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:core", "area:ui", "priority:high"]
    body: |
      Upload CSV, map columns to fields, preview, and detect duplicates by normalized title + artist.
      Match each row to the catalog (via `catalog-search`) and let the user confirm or skip matches, so imported songs get artwork and IDs too.
      Parsing and mapping logic lives in core (reusable on web).

  - title: "Song detail panel"
    milestone: "Phase 1 — Song library"
    labels: ["type:feature", "area:ui"]
    body: |
      Side panel with all fields and notes. Placeholder area for history (filled in Phase 5).

  # ───────────────────────── Phase 2 ─────────────────────────
  - title: "Venues: CRUD"
    milestone: "Phase 2 — Gigs & setlist builder"
    labels: ["type:feature", "area:ui"]
    body: |
      Simple list and form. Venue picker with inline "create new".

  - title: "Gigs: create / edit / cancel"
    milestone: "Phase 2 — Gigs & setlist builder"
    labels: ["type:feature", "area:ui", "area:core", "priority:high"]
    body: |
      Date, venue, times, notes, status. Creating a gig creates an empty setlist with one set block ("Set 1").

  - title: "Gigs: upcoming and past views"
    milestone: "Phase 2 — Gigs & setlist builder"
    labels: ["type:feature", "area:ui", "priority:high"]
    body: |
      Upcoming list sorted by date with countdown. Past list grouped by year.

  - title: "Setlist editor: multiple set blocks (add, rename, reorder, delete)"
    milestone: "Phase 2 — Gigs & setlist builder"
    labels: ["type:feature", "area:ui", "priority:high"]
    body: |
      For example "Set 1", "Set 2", "Encore". Set blocks are reorderable with drag and drop.

  - title: "Setlist editor: drag songs from library into sets"
    milestone: "Phase 2 — Gigs & setlist builder"
    labels: ["type:feature", "area:ui", "priority:high"]
    body: |
      Library panel beside the editor, using dnd-kit. Dropping at a position creates a SetEntry with a fractional position.
      Keyboard-accessible alternative: "Add to set" plus arrow keys.

  - title: "Setlist editor: reorder within and move between sets"
    milestone: "Phase 2 — Gigs & setlist builder"
    labels: ["type:feature", "area:ui", "area:core", "priority:high"]
    body: |
      Drag and drop within a set and across set blocks. Each move persists by updating a single row. Undo/redo for the last N actions.

  - title: "Setlist editor: breaks, notes and segues"
    milestone: "Phase 2 — Gigs & setlist builder"
    labels: ["type:feature", "area:ui"]
    body: |
      Insert non-song entries (break or note), toggle "segue into next", and override the key per entry.

  - title: "Setlist editor: running time and warnings"
    milestone: "Phase 2 — Gigs & setlist builder"
    labels: ["type:feature", "area:core", "area:ui"]
    body: |
      Per-set and total duration, with a target length per set. Warn about duplicate songs, retired songs, and songs with missing durations.

  # ───────────────────────── Phase 3 ─────────────────────────
  - title: "Core: cloneSetlist() pure function"
    milestone: "Phase 3 — Cloning & templates"
    labels: ["type:feature", "area:core", "priority:high"]
    body: |
      Deep copy with new IDs and `clonedFromId` set. Options: drop retired songs, reset key overrides, keep or strip notes.
      **Done when:** unit tests cover all options.

  - title: "Clone setlist into a new or existing gig"
    milestone: "Phase 3 — Cloning & templates"
    labels: ["type:feature", "area:ui", "priority:high"]
    body: |
      "Start from…" picker on the gig page: search past gigs, upcoming gigs and templates with a preview. Ask before replacing an existing setlist.

  - title: "Templates: save setlist as template, manage templates"
    milestone: "Phase 3 — Cloning & templates"
    labels: ["type:feature", "area:ui"]
    body: |
      Templates view (for example "Wedding 3×45", "Bar 2×60"). Templates aren't tied to a gig.

  - title: "Show 'cloned from' lineage on setlists"
    milestone: "Phase 3 — Cloning & templates"
    labels: ["type:feature", "area:ui", "priority:low"]
    body: |
      A link back to the source setlist or gig, plus a diff view showing songs added and removed compared with the source.

  # ───────────────────────── Phase 4 ─────────────────────────
  - title: "Backend: band data schema and row-level security"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:feature", "area:backend", "priority:high"]
    body: |
      Band data tables mirroring `@setlist/core` in Setlist Maker's Supabase project (created in Phase 0), added as migrations in `supabase/`. Row-level security so only members of a band can read it, and only owners/editors can write. Viewers are read-only.
      **Done when:** policy tests prove a user can't read or write another band's rows.

  - title: "Sync: connect local SQLite to the backend"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:feature", "area:storage", "area:backend", "priority:high"]
    body: |
      Wire the chosen sync engine into `packages/storage`. Sync is off while the band is solo. The first share uploads the band's existing data. Changes from other members appear live without a reload.
      **Done when:** two desktop instances editing the same band converge, including after one goes offline and reconnects.

  - title: "Silent anonymous identity on first share"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:feature", "area:desktop", "area:backend", "priority:high"]
    body: |
      The first time someone shares or accepts an invite, create an anonymous Supabase user in the background and store the session securely on the device. No sign-up screen, only a display name prompt.

  - title: "Read-only share links with web viewer"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:feature", "area:web", "area:ui", "priority:high"]
    body: |
      **Share → Copy link** for a setlist or gig. Opens a lightweight web page (reusing `packages/ui`) that updates live, works on phones and needs no install or account. Tokens are unguessable, only their hash is stored, and links can be revoked.

  - title: "Band invites with role, expiry and revoke"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:feature", "area:core", "area:ui", "area:backend", "priority:high"]
    body: |
      **Invite to band** creates a link with a role (editor or viewer), an expiry date and a maximum number of uses. Opening it in the app asks for a display name and joins the band. Owners can see and revoke pending invites.

  - title: "Band members and roles"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:feature", "area:core", "area:ui", "area:backend"]
    body: |
      Members list with display names and roles (owner, editor, viewer). Owners can change roles, remove members and transfer ownership. The UI hides editing controls for viewers.

  - title: "Activity feed and change attribution"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:feature", "area:core", "area:ui"]
    body: |
      Fill `updatedBy` on every write. Show recent changes per gig ("Ana moved *Song X* to the encore") and a "changed since you last looked" marker.

  - title: "Secure your account: link email or Google/Apple"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:feature", "area:desktop", "area:backend"]
    body: |
      Upgrade the anonymous user to a permanent account (email magic link, Google, Apple), keeping the same user ID and data. Suggest it once a second member joins. Signing in on a new device restores access to the band.

  - title: "Concurrent editing and offline tests"
    milestone: "Phase 4 — Sharing & collaboration"
    labels: ["type:chore", "area:storage", "priority:high"]
    body: |
      Automated scenarios: two members reorder the same set, one deletes a song the other just added, edits made offline then synced, a revoked member's device stops receiving data.
      **Done when:** no scenario leaves a setlist with duplicate or missing entries.

  # ───────────────────────── Phase 5 ─────────────────────────
  - title: "Mark gig as played → snapshot performances"
    milestone: "Phase 5 — History & insights"
    labels: ["type:feature", "area:core", "area:storage", "priority:high"]
    body: |
      Convert the setlist into Performance records (title/key snapshots, set name, position) in one transaction. Allow edits to "what we actually played" before confirming.

  - title: "Import historical gigs (backfill)"
    milestone: "Phase 5 — History & insights"
    labels: ["type:feature", "area:core", "area:ui", "priority:high"]
    body: |
      Bulk-create past gigs from CSV (date, venue, ordered songs) so the history starts with real data.

  - title: "Core: song statistics"
    milestone: "Phase 5 — History & insights"
    labels: ["type:feature", "area:core", "priority:high"]
    body: |
      Times played, first and last played, days since last played, average position, opener/closer counts, and per-venue counts. Pure functions over performances.

  - title: "Song history timeline in song detail"
    milestone: "Phase 5 — History & insights"
    labels: ["type:feature", "area:ui"]
    body: |
      Each performance with date, venue, set and position, and rating/notes.

  - title: "Stats dashboard"
    milestone: "Phase 5 — History & insights"
    labels: ["type:feature", "area:ui"]
    body: |
      Most and least played, "not played in N gigs", gigs per month, and a breakdown of originals vs covers.

  - title: "Post-gig rating and notes per song"
    milestone: "Phase 5 — History & insights"
    labels: ["type:feature", "area:ui", "priority:low"]
    body: |
      Quick 1–5 rating and a note on each performance after marking the gig as played.

  - title: "Builder hints from history"
    milestone: "Phase 5 — History & insights"
    labels: ["type:feature", "area:ui", "priority:low"]
    body: |
      In the library panel: last-played badge, "played here last time" marker, and sorting by staleness.

  # ───────────────────────── Phase 6 ─────────────────────────
  - title: "Print / PDF setlist"
    milestone: "Phase 6 — Output & stage use"
    labels: ["type:feature", "area:ui", "priority:high"]
    body: |
      Large-font layout, one page per set, optional key/BPM/notes columns, and a print preview.

  - title: "Stage mode (full-screen setlist)"
    milestone: "Phase 6 — Output & stage use"
    labels: ["type:feature", "area:ui"]
    body: |
      High-contrast full-screen view with the current and next song. Keyboard or pedal (arrow keys) to advance.

  - title: "JSON backup and restore"
    milestone: "Phase 6 — Output & stage use"
    labels: ["type:feature", "area:core", "area:storage", "priority:high"]
    body: |
      Versioned interchange document validated by the core schemas, with automatic local backups on app start (keep the last N).

  - title: "CSV export (songs, gigs, performances)"
    milestone: "Phase 6 — Output & stage use"
    labels: ["type:feature", "area:core", "priority:low"]
    body: |
      For spreadsheets and sharing with band members.

  # ───────────────────────── Phase 7 ─────────────────────────
  - title: "Release workflow: tag → signed installers on GitHub Releases"
    milestone: "Phase 7 — Release & distribution"
    labels: ["type:chore", "area:infra", "area:desktop", "priority:high"]
    body: |
      On `v*` tags: build Windows (.msi/.exe) and macOS (.dmg, notarized), and attach them to a draft release. Signing secrets are stored in repo secrets.

  - title: "Auto-update"
    milestone: "Phase 7 — Release & distribution"
    labels: ["type:feature", "area:desktop"]
    body: |
      Tauri updater pointing at GitHub Releases, with an in-app "update available" prompt.

  - title: "Opt-in error reporting"
    milestone: "Phase 7 — Release & distribution"
    labels: ["type:feature", "area:desktop", "priority:low"]
    body: |
      Local error log viewer, plus optional remote reporting that's off by default.

  # ───────────────────────── Phase 8 ─────────────────────────
  - title: "Web app reusing core and ui packages"
    milestone: "Phase 8 — Web & mobile apps"
    labels: ["type:feature", "area:web"]
    body: |
      Grow the Phase 4 share viewer into the full editor: Vite app on the sync engine's browser storage, signed in with the same anonymous or linked account.

  - title: "Mobile app (view setlists, stage mode)"
    milestone: "Phase 8 — Web & mobile apps"
    labels: ["type:feature", "area:mobile"]
    body: |
      Tauri mobile or React Native using `@setlist/core` and the same sync. Read-only and stage mode first, with touch drag and drop later.
