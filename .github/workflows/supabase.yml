name: Supabase

# Pull requests: apply every migration to a throwaway local database and run the database tests,
# so broken SQL or access rules never merge.
# Pushes to main: apply new migrations to the hosted project, then deploy the Edge Functions.
on:
  pull_request:
    paths:
      - supabase/**
      - .github/workflows/supabase.yml
  push:
    branches: [main]
    paths:
      - supabase/**
      - .github/workflows/supabase.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      # Starts Postgres in Docker and applies supabase/migrations in order.
      - name: Apply migrations to a local database
        run: pnpm exec supabase db start

      - name: Lint the database schema
        run: pnpm exec supabase db lint --local --level warning --fail-on error

      # pgTAP tests in supabase/tests, e.g. proving bands can't see each other's data.
      - name: Run the database tests
        run: pnpm exec supabase test db

  deploy:
    name: Deploy migrations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two deploys at once, and never cancel one halfway.
    concurrency:
      group: supabase-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check the project is configured
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN (secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD (secret)"
          [ -n "$SUPABASE_PROJECT_ID" ] || missing="$missing SUPABASE_PROJECT_ID (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing. See README, 'Supabase'."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: Apply new migrations
        run: pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_ID" --yes

      # Spotify's client ID and secret are function secrets, set once by hand (README, "Spotify").
      - name: Deploy Edge Functions
        run: |
          pnpm exec supabase functions deploy catalog-search --project-ref "$SUPABASE_PROJECT_ID" --use-api
          pnpm exec supabase functions deploy spotify-playlist --project-ref "$SUPABASE_PROJECT_ID" --use-api
