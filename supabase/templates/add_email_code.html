<!-- Sent when someone adds this email to their Setlist Maker sign-in ("Change Email Address"
     template in Supabase). Shows the 6-digit code they type into the app. -->
<div
  style="
    font-family:
      system-ui,
      -apple-system,
      'Segoe UI',
      Roboto,
      sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px;
    color: #1c1c21;
  "
>
  <p style="margin: 0 0 4px; color: #5b21b6; font-weight: 700">Setlist Maker</p>
  <h1 style="margin: 0 0 16px; font-size: 22px">Confirma tu correo</h1>
  <p style="margin: 0 0 16px">
    Escribe este código en Setlist Maker para agregar este correo a tu cuenta. Así podrás iniciar
    sesión con él en tus otros dispositivos.
  </p>
  <p
    style="
      margin: 0 0 16px;
      padding: 16px;
      border-radius: 8px;
      background: #ede9fe;
      color: #5b21b6;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      text-align: center;
    "
  >
    {{ .Token }}
  </p>
  <p style="margin: 0; color: #5f5f69; font-size: 14px">
    El código funciona durante una hora. Si no lo pediste, ignora este correo.
  </p>
</div>
